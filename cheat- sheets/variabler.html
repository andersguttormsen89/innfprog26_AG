<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet Variabler</title>
</head>
<body>
<h1>Variabler i JacaScript</h1>
<p>Hei, <span id="name"></span> (<span id= "age">?</span> år)</p>

<script>
//DEKLARERE VARIABLER
/*
 *const: deklarere en kontsant verdi som ikke skal endres
 *let: deklarere en verdi som kan endres
 */ 
const firstname = "Anders"
console.log(firstname)
const lastname = "Guttormsen"
//Skriv ut firstname-verdi til HTML-element med id name:
//Vi bruker kontatinering, altså slår sammen variabler og tekst, for å skrive ut fornavn + etternavn
document.getElementById("name").innerHTML = firstname + " " + lastname

//DEKLARERE EN VARIABEL FOR ALDER
const birthYear = 1989
let age = 2026 - birthYear 
document.getElementById("age") .innerHTML = age
</script>
</body>
</html>
