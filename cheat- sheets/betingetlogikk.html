<body>
    <p> id="loginStatus>Ikke logget inn</p>
    <script>
const username = "Anders"
const password = "passord123"
let loggedIn = false 

//IF-test som sjekker om innsendt brukernavn matcher systemet:
if(username === "Anders") {
    console.log("Brukernavn er riktig")
} else {
    console.log("Feil Brukernavn")
}

    //If- test som sjekker om brukernavn og passord er riktg, og gjør klar loggin:
    if(username ==="Anders" && password === "passord123") {
        loggedIn = true 
        console.log(loggedIn)
    }
    </script>
